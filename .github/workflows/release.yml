name: Release CLI

# Pushing a tag such as v0.1.0 compiles the console utility for Windows with
# the production server baked in and attaches it to a GitHub release, so the
# stable download link is
# https://github.com/<owner>/<repo>/releases/latest/download/secret.exe
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Build secret.exe & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the asset
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Compile the Windows executable
        env:
          SECRET_MANAGER_URL: ${{ vars.SECRET_MANAGER_URL }}
        run: bun run build:cli
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/secret.exe \
            --title "secret ${GITHUB_REF_NAME}" \
            --notes "Windows console utility for ${{ vars.SECRET_MANAGER_URL }}. Download secret.exe, run it, type \`login\` and paste a token created on the web site (CLI tokens section). See documentation/user/cli.md."
